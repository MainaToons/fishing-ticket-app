<fieldset [formGroup]="personalDataGroup" class="form-section">
  <legend>Personal Data</legend>
  <div class="form-grid">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input id="fullName" type="text" formControlName="fullName" placeholder="John Doe">
      <div *ngIf="personalDataGroup.get('fullName')?.invalid && (personalDataGroup.get('fullName')?.dirty || personalDataGroup.get('fullName')?.touched)" class="error-message">
        Full Name is required.
      </div>
    </div>

    <div class="form-group">
      <label for="egn">EGN (Bulgarian Personal ID)</label>
      <input id="egn" type="text" formControlName="egn" placeholder="XXXXXXXXXX">
      <div *ngIf="personalDataGroup.get('egn')?.invalid && (personalDataGroup.get('egn')?.dirty || personalDataGroup.get('egn')?.touched)" class="error-message">
        EGN is required and must be 10 digits.
      </div>
    </div>

    <div class="form-group">
      <label for="idCardNumber">ID Card Number</label>
      <input id="idCardNumber" type="text" formControlName="idCardNumber" placeholder="ABC123456">
      <div *ngIf="personalDataGroup.get('idCardNumber')?.invalid && (personalDataGroup.get('idCardNumber')?.dirty || personalDataGroup.get('idCardNumber')?.touched)" class="error-message">
        ID Card Number is required (e.g., 9 alphanumeric chars).
      </div>
    </div>

    <div class="form-group">
      <label for="phoneNumber">Phone Number</label>
      <input id="phoneNumber" type="tel" formControlName="phoneNumber" placeholder="+359XXXXXXXX">
      <div *ngIf="personalDataGroup.get('phoneNumber')?.invalid && (personalDataGroup.get('phoneNumber')?.dirty || personalDataGroup.get('phoneNumber')?.touched)" class="error-message">
        Phone Number is required (e.g., +359XXXXXXXX).
      </div>
    </div>

    <div class="form-group full-width">
      <label for="email">Email Address</label>
      <input id="email" type="email" formControlName="email" placeholder="john.doe@example.com">
      <div *ngIf="personalDataGroup.get('email')?.invalid && (personalDataGroup.get('email')?.dirty || personalDataGroup.get('email')?.touched)" class="error-message">
        Valid Email is required.
      </div>
    </div>
  </div>
</fieldset>
