<fieldset [formGroup]="addressGroup" class="form-section">
  <legend>Address</legend>
  <div class="form-grid">
    <div class="form-group">
      <label for="country">Country</label>
      <input id="country" type="text" formControlName="country" placeholder="Bulgaria">
      <div *ngIf="addressGroup.get('country')?.invalid && (addressGroup.get('country')?.dirty || addressGroup.get('country')?.touched)" class="error-message">
        Country is required.
      </div>
    </div>

    <div class="form-group">
      <label for="region">Region</label>
      <input id="region" type="text" formControlName="region" placeholder="Sofia Region">
      <div *ngIf="addressGroup.get('region')?.invalid && (addressGroup.get('region')?.dirty || addressGroup.get('region')?.touched)" class="error-message">
        Region is required.
      </div>
    </div>

    <div class="form-group">
      <label for="municipality">Municipality</label>
      <input id="municipality" type="text" formControlName="municipality" placeholder="Sofia Municipality">
      <div *ngIf="addressGroup.get('municipality')?.invalid && (addressGroup.get('municipality')?.dirty || addressGroup.get('municipality')?.touched)" class="error-message">
        Municipality is required.
      </div>
    </div>

    <div class="form-group">
      <label for="city">City</label>
      <input id="city" type="text" formControlName="city" placeholder="Sofia">
      <div *ngIf="addressGroup.get('city')?.invalid && (addressGroup.get('city')?.dirty || addressGroup.get('city')?.touched)" class="error-message">
        City is required.
      </div>
    </div>

    <div class="form-group full-width">
      <label for="street">Street</label>
      <input id="street" type="text" formControlName="street" placeholder="Vitosha Blvd. 10">
      <div *ngIf="addressGroup.get('street')?.invalid && (addressGroup.get('street')?.dirty || addressGroup.get('street')?.touched)" class="error-message">
        Street is required.
      </div>
    </div>
  </div>
</fieldset>
